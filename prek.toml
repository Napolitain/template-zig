minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "fix-byte-order-marker" },
    { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys", "--indent", "4"] },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "zig-fmt"
name = "zig fmt"
language = "system"
entry = "zig fmt"
files = '\.(zig|zon)$'
stages = ["pre-commit"]
priority = 10

[[repos.hooks]]
id = "zig-build"
name = "zig build"
language = "system"
entry = "zig build"
files = '\.(zig|zon)$'
pass_filenames = false
stages = ["pre-commit"]
priority = 20

[[repos.hooks]]
id = "zig-test"
name = "zig build test"
language = "system"
entry = "zig build test"
files = '\.(zig|zon)$'
pass_filenames = false
stages = ["pre-push"]
priority = 10
